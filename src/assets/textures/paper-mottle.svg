<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- Very soft uneven tone, like uncoated stock -->
  <filter id="m" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.16 -0.04"/>
  </filter>
  <rect width="900" height="900" filter="url(#m)"/>
</svg>
